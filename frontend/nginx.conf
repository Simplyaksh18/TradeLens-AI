# Serves the built React SPA and reverse-proxies /api/ to the backend
# container, so the browser only ever talks to ONE origin (this container's)
# and never needs a Docker-internal hostname compiled into frontend JS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: direct/refreshed loads of routes like /strategy-lab or
    # /login must serve index.html, not a bare-Nginx 404. Real static assets
    # (JS/CSS/etc, matched by $uri) are still served directly first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
